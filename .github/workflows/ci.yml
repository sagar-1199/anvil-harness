# Minimal CI: install on Linux + macOS, verify the package imports and the
# wheel builds. We don't run the TUI in CI (no display), but a clean import
# catches 80% of regressions: missing modules, broken type hints under
# `from __future__ import annotations`, import-time crashes.
#
# Pin runner versions explicitly so a GitHub-side OS roll doesn't silently
# change the test surface.

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python }}
        run: uv python install ${{ matrix.python }}

      - name: Sync dependencies
        run: uv sync --python ${{ matrix.python }}

      - name: Import smoke
        run: |
          uv run --python ${{ matrix.python }} python -c "
          from anvil_harness import app, config, detect, engine, memory, models, storage
          assert callable(app.run)
          assert 'claude' in engine.ENGINES
          assert 'codex' in engine.ENGINES
          assert 'mock' in engine.ENGINES
          print('OK')
          "

      - name: Build wheel
        run: uv build

      - name: Verify wheel installs in a clean venv
        run: |
          python -m venv /tmp/verify
          /tmp/verify/bin/pip install --quiet dist/*.whl
          /tmp/verify/bin/python -c "import anvil_harness; assert callable(anvil_harness.main)"
          test -x /tmp/verify/bin/anvil
